<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz-app</title>
</head>
<body>
    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        main {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }

        h1, h2 {
            text-align: center;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 10px; 
            flex-wrap: wrap;

        }

        button {
            padding: 10px 15px; 
            margin: 5px 0;
            border: none; 
            border-radius: 6px;
            background: #df9bdf;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #b05fab;
        }

        .option {
            display: block; 
            padding: 10px;
            margin: 5px 0;
            border-radius: 6px;
            background: #e9ecef;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            background: #d6d8db;
        }

        .option.active {
            background: #b05fab;
            color: white;
        }

    </style>

    <div id="app"></div>

    <script src="model.js"></script>
    <script src="controller.js"></script>
    <script src="view.js"></script>
</body>
</html>
